name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component clippy,rustfmt
          rustc -V
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: ${{ steps.toolchain.outputs.channel }}
          command: check advisories bans licenses sources

  release-build:
    name: release build (amd64 + arm64, glibc 2.34)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain and targets
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup target add --toolchain "$channel" x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-zigbuild
        run: pip install --user 'cargo-zigbuild>=0.19,<1'
      - name: Build both targets against glibc 2.34
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            cargo zigbuild --release --locked -p tap-codex-kernel --target "$target.2.34"
            cargo xtask check-glibc --binary "target/$target/release/tap-codex-kernel" --max 2.34
          done
